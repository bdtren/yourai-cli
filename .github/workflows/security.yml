name: security

# Supply-chain and advisory checks for the Rust CLI.
# Fails on known vulnerabilities; license/source policy lives in deny.toml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC — new advisories without a code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin
          key: cargo-audit-${{ runner.os }}-v1
      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-deny
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin
          key: cargo-deny-${{ runner.os }}-v1
      - name: Install cargo-deny
        # Prefer cargo install over cargo-deny-action: that action builds a Docker
        # image and downloads a fixed release tarball that has been failing (gzip invalid magic).
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny --locked
      - name: cargo deny
        # all-features is set in deny.toml [graph]
        run: cargo deny check
