[package]
name = "yourai-cli"
version = "0.0.7"
edition = "2021"
description = "Build and run your own local AI"
license = "Apache-2.0"
homepage = "https://yourai.bdtren.com"
repository = "https://github.com/bdtren/yourai-cli"
rust-version = "1.85"

[[bin]]
name = "yourai"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "matched-path", "ws"] }
base64 = "0.22"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
console = "0.16.6"
dirs = "7.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
indicatif = "0.18.6"
inquire = "0.9.4"
pdf-extract = "0.12.1"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "http2", "stream", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.38.4"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "fs"] }
toml = "1.1.8"
toml_edit = "0.25.17"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
